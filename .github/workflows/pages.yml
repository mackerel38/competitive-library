name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81"
          python -m pip install online-judge-verify-helper

      - name: Run verification
        run: oj-verify run

      - name: Refresh newly added verifier statuses
        run: |
          oj-verify run \
            verify/yosupo_deque.test.cpp \
            verify/yosupo_deque_operate_all_composite.test.cpp \
            verify/yosupo_double_ended_priority_queue.test.cpp \
            verify/yosupo_line_add_get_min.test.cpp \
            verify/yosupo_majority_voting.test.cpp \
            verify/yosupo_ordered_set.test.cpp \
            verify/yosupo_persistent_queue.test.cpp \
            verify/yosupo_point_set_range_frequency.test.cpp \
            verify/yosupo_predecessor_problem.test.cpp \
            verify/yosupo_range_add_range_min.test.cpp \
            verify/yosupo_range_reverse_range_sum.test.cpp \
            verify/yosupo_rectangle_sum.test.cpp \
            verify/yosupo_segment_add_get_min.test.cpp \
            verify/yosupo_static_range_frequency.test.cpp \
            verify/yosupo_static_range_sum.test.cpp \
            verify/yosupo_static_range_sum_with_upper_bound.test.cpp \
            verify/yosupo_unionfind_with_potential.test.cpp

      - name: Generate documentation
        run: oj-verify docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .verify-helper/markdown
          destination: .verify-helper/markdown/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .verify-helper/markdown/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
